name: Build MCP Server

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/ExcelMcp.McpServer/**'
      - 'src/ExcelMcp.Core/**'
      - 'src/ExcelMcp.ComInterop/**'
      - 'tests/ExcelMcp.McpServer.Tests/**'
      - 'tests/ExcelMcp.Core.Tests/**'
      - 'tests/ExcelMcp.Diagnostics.Tests/**'
      - 'tests/ExcelMcp.ComInterop.Tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-mcp-server.yml'

jobs:
  build-mcp-server:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj

    - name: Build MCP Server
      run: dotnet build src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj --no-restore --configuration Release

    - name: Publish MCP Server (standalone exe)
      run: |
        dotnet publish src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          --output ./mcp-server-publish
      shell: pwsh

    - name: Rename exe to mcp-excel.exe
      run: |
        $expectedExe = "mcp-server-publish/Sbroenne.ExcelMcp.McpServer.exe"
        if (Test-Path $expectedExe) {
          Rename-Item $expectedExe "mcp-excel.exe"
          Write-Output "✅ Renamed to mcp-excel.exe"
        } else {
          Write-Error "Expected executable not found at: $expectedExe"
          Write-Output "Contents of mcp-server-publish/:"
          Get-ChildItem "mcp-server-publish/" | Select-Object Name
          exit 1
        }
      shell: pwsh

    - name: Verify Core Commands Coverage
      run: |
        Write-Output "🔍 Verifying Core Commands coverage..."
        & scripts/audit-core-coverage.ps1 -FailOnGaps
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Coverage gaps detected! All Core methods must be exposed via MCP Server."
          exit 1
        }
        Write-Output "✅ Coverage audit passed - 100% coverage maintained"
      shell: pwsh

    - name: Verify MCP Server build
      run: |
        # Check standalone executable
        if (Test-Path "mcp-server-publish/mcp-excel.exe") {
          Write-Output "✅ mcp-excel.exe built successfully (standalone)"
          $mcpVersion = (Get-Item "mcp-server-publish/mcp-excel.exe").VersionInfo.FileVersion
          Write-Output "📦 MCP Server Version: $mcpVersion"

          # Check for MCP server.json configuration
          if (Test-Path "src/ExcelMcp.McpServer/bin/Release/net10.0-windows/.mcp/server.json") {
            Write-Output "✅ MCP server.json configuration found"
          } else {
            Write-Warning "⚠️ MCP server.json configuration not found"
          }
        } else {
          Write-Error "❌ mcp-excel.exe not found"
          exit 1
        }

        Write-Output "🧠 MCP Server ready for AI assistant integration"
      shell: pwsh

    - name: Upload MCP Server build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ExcelMcp-MCP-Server-${{ github.sha }}
        path: mcp-server-publish/
